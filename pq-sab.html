<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PQ Single-Address Backup - Offline Encryptor v1</title>
<style>
body{font-family:monospace; max-width:700px; margin:40px auto; background:#111; color:#0f0; padding:20px}
textarea,input{width:100%; background:#000; color:#0f0; border:1px solid #0f0; padding:10px; margin:10px 0}
button{background:#0f0; color:#000; border:0; padding:12px 20px; font-weight:bold; cursor:pointer; width:100%}
pre{white-space:pre-wrap; word-break:break-all; background:#000; padding:15px; border:1px dashed #0f0}
small{color:#888}
</style>
</head>
<body>
<h2>PQ Single-Address Backup v1</h2>
<p><small>OFFLINE ONLY. No network calls. Auditable. PBKDF2 200k + AES-GCM.<br>
Companion to BIP-360 / FIPS-205. BIP-38-like.</small></p>

<label>32-byte seed (hex, 64 chars):</label>
<input id="seedHex" placeholder="e.g. 4a5b... 64 hex chars">

<label>OR 32-byte seed (base64, 44 chars):</label>
<input id="seedB64" placeholder="optional if hex given">

<label>Password (strong, for canning):</label>
<input id="pwd" type="password" placeholder="strong password">

<button onclick="encrypt()">CAN IT -> Encrypt</button>

<pre id="out"></pre>

<hr>
<label>Paste BACKUP BLOCK to restore:</label>
<textarea id="block" rows="6" placeholder="-----BEGIN PQ SINGLE-ADDRESS BACKUP-----"></textarea>
<label>Password:</label>
<input id="pwd2" type="password">
<button onclick="decrypt()">UNCAN -> Decrypt</button>
<pre id="out2"></pre>

<script>
async function deriveKey(pwd, salt){
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey("raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt: salt, iterations: 200000, hash:"SHA-256"}, keyMat, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
function b64e(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64d(s){ return Uint8Array.from(atob(s.trim()), c=>c.charCodeAt(0)); }
function hexToBytes(hex){
  hex=hex.trim().replace(/^0x/,''); if(hex.length!==64) throw "hex must be 64 chars (32 bytes)";
  return Uint8Array.from(hex.match(/../g).map(h=>parseInt(h,16)));
}
function bytesToHex(b){ return [...b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function encrypt(){
 try{
  let seed;
  if(document.getElementById('seedHex').value.trim()){
    seed = hexToBytes(document.getElementById('seedHex').value);
  } else {
    const raw = b64d(document.getElementById('seedB64').value); if(raw.length!==32) throw "b64 seed must be 32 bytes"; seed=raw;
  }
  const pwd = document.getElementById('pwd').value; if(!pwd) throw "need password";
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pwd, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, seed));
  const combined = new Uint8Array(salt.length+iv.length+ct.length);
  combined.set(salt,0); combined.set(iv, salt.length); combined.set(ct, salt.length+iv.length);
  const b64 = b64e(combined);
  // pretty block ~200 chars
  const block = `-----BEGIN PQ SINGLE-ADDRESS BACKUP-----
${b64.match(/.{1,64}/g).join('\n')}
KDF: PBKDF2-SHA256-200k
-----END PQ SINGLE-ADDRESS BACKUP-----`;
  document.getElementById('out').textContent = block + "\n\nHex for debug: " + bytesToHex(seed) + " (DO NOT SAVE)";
 }catch(e){ document.getElementById('out').textContent = "Error: "+e; }
}
async function decrypt(){
 try{
  const txt = document.getElementById('block').value;
  const m = txt.match(/BEGIN[\s\S]*?([A-Za-z0-9+\/=\n\r]+)[\s\S]*?END/);
  if(!m) throw "bad block format";
  const b64 = m[1].replace(/\s/g,'');
  const all = b64d(b64);
  const salt = all.slice(0,16); const iv = all.slice(16,28); const ct = all.slice(28);
  const pwd = document.getElementById('pwd2').value; if(!pwd) throw "need password";
  const key = await deriveKey(pwd, salt);
  const pt = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct));
  document.getElementById('out2').textContent = "OK DECRYPTED\nHex (64 chars): "+bytesToHex(pt)+"\nBase64 (44 chars): "+b64e(pt);
 }catch(e){ document.getElementById('out2').textContent = "Error: "+e+" (wrong password or corrupted)"; }
}
</script>
</body>
</html>
